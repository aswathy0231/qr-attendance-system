<!DOCTYPE html>
<html lang="en">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>Add Student</title>

    <style>
        * {
            box-sizing: border-box;
            margin: 0;
            padding: 0;
        }

        body {
            font-family: Arial, sans-serif;
            background: #f7f8fc;
            color: #101828;
        }

        .header {
            background: #175cd3;
            color: white;
            padding: 20px 30px;

            display: flex;
            justify-content: space-between;
            align-items: center;
        }

        .header h1 {
            font-size: 22px;
        }

        .back {
            color: white;
            text-decoration: none;
            font-size: 14px;
        }

        .container {
            max-width: 650px;
            margin: auto;
            padding: 30px;
        }

        .card {
            background: white;
            padding: 30px;
            border-radius: 16px;

            box-shadow:
                0 4px 15px rgba(0, 0, 0, 0.06);
        }

        h2 {
            margin-bottom: 8px;
        }

        .description {
            color: #667085;
            margin-bottom: 25px;
        }

        .form-group {
            margin-bottom: 18px;
        }

        label {
            display: block;
            font-size: 13px;
            font-weight: bold;
            margin-bottom: 7px;
        }

        input {
            width: 100%;
            padding: 12px;

            border: 1px solid #d0d5dd;
            border-radius: 9px;

            font-size: 14px;
            outline: none;
        }

        input:focus {
            border-color: #175cd3;
        }

        .error {
            background: #fff1f0;
            color: #d92d20;

            padding: 12px;
            border-radius: 9px;

            margin-bottom: 18px;
            font-size: 13px;
        }

        .submit-button {
            width: 100%;
            padding: 13px;

            background: #175cd3;
            color: white;

            border: none;
            border-radius: 9px;

            font-size: 15px;
            font-weight: bold;

            cursor: pointer;
        }

        .submit-button:hover {
            background: #124bb3;
        }
    </style>
</head>

<body>

    <header class="header">

        <h1>QR Attendance System</h1>

        <a
            href="/admin-web/students/"
            class="back"
        >
            ← Back to Students
        </a>

    </header>


    <main class="container">

        <div class="card">

            <h2>Add Student</h2>

            <p class="description">
                Enter the details of the new student.
            </p>


            {% if error_message %}

                <div class="error">
                    {{ error_message }}
                </div>

            {% endif %}


            <form method="POST">

                {% csrf_token %}


                <!-- Username -->

                <div class="form-group">

                    <label for="username">
                        Username
                    </label>

                    <input
                        type="text"
                        id="username"
                        name="username"
                        placeholder="Enter username"
                        maxlength="50"
                        required
                    >

                </div>


                <!-- Password -->

                <div class="form-group">

                    <label for="password">
                        Password
                    </label>

                    <input
                        type="password"
                        id="password"
                        name="password"
                        placeholder="Enter password"
                        required
                    >

                </div>


                <!-- Register Number -->

                <div class="form-group">

                    <label for="register_no">
                        Register Number
                    </label>

                    <input
                        type="text"
                        id="register_no"
                        name="register_no"
                        placeholder="Enter register number"
                        maxlength="11"
                        required
                    >

                </div>


                <!-- Full Name -->

                <div class="form-group">

                    <label for="full_name">
                        Full Name
                    </label>

                    <input
                        type="text"
                        id="full_name"
                        name="full_name"
                        placeholder="Enter full name"
                        maxlength="12"
                        required
                    >

                </div>


                <!-- Email -->

                <div class="form-group">

                    <label for="email">
                        Email
                    </label>

                    <input
                        type="email"
                        id="email"
                        name="email"
                        placeholder="Enter email"
                    >

                </div>


                <!-- Phone -->

                <div class="form-group">

                    <label for="phone">
                        Phone
                    </label>

                    <input
                        type="text"
                        id="phone"
                        name="phone"
                        maxlength="11"
                        placeholder="Enter phone number"
                    >

                </div>


                <!-- Class -->

                <div class="form-group">

                    <label for="class_id">
                        Class ID
                    </label>

                    <input
                        type="number"
                        id="class_id"
                        name="class_id"
                        placeholder="Enter class ID"
                        required
                    >

                </div>


                <!-- Submit -->

                <button
                    type="submit"
                    class="submit-button"
                >
                    Add Student
                </button>

            </form>

        </div>

    </main>

</body>
</html>
