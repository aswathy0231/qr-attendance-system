<!DOCTYPE html>
<html lang="en">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">

    <title>Add Subject Assignment</title>

    <style>
        * {
            box-sizing: border-box;
            margin: 0;
            padding: 0;
        }

        body {
            font-family: Arial, sans-serif;
            background: #f7f8fc;
            color: #101828;
        }

        .header {
            background: #175cd3;
            color: white;
            padding: 20px 30px;
            display: flex;
            justify-content: space-between;
            align-items: center;
        }

        .header h1 {
            font-size: 22px;
        }

        .back {
            color: white;
            text-decoration: none;
            font-size: 14px;
        }

        .container {
            max-width: 700px;
            margin: auto;
            padding: 30px;
        }

        .page-title {
            margin-bottom: 20px;
        }

        .page-title h2 {
            font-size: 26px;
            margin-bottom: 6px;
        }

        .page-title p {
            color: #667085;
        }

        .form-container {
            background: white;
            border-radius: 16px;
            padding: 25px;
            box-shadow: 0 4px 15px rgba(0, 0, 0, 0.06);
        }

        .form-group {
            margin-bottom: 18px;
        }

        label {
            display: block;
            font-size: 14px;
            font-weight: bold;
            margin-bottom: 7px;
        }

        select,
        input {
            width: 100%;
            padding: 11px 12px;
            border: 1px solid #d0d5dd;
            border-radius: 8px;
            font-size: 14px;
            background: white;
        }

        select:focus,
        input:focus {
            outline: none;
            border-color: #175cd3;
        }

        .error {
            background: #fef3f2;
            color: #b42318;
            padding: 12px;
            border-radius: 8px;
            margin-bottom: 18px;
            font-size: 14px;
        }

        .buttons {
            display: flex;
            gap: 10px;
            margin-top: 25px;
        }

        .save-button {
            background: #175cd3;
            color: white;
            border: none;
            padding: 11px 18px;
            border-radius: 9px;
            font-size: 14px;
            font-weight: bold;
            cursor: pointer;
        }

        .save-button:hover {
            background: #124bb3;
        }

        .cancel-button {
            background: #f2f4f7;
            color: #344054;
            text-decoration: none;
            padding: 11px 18px;
            border-radius: 9px;
            font-size: 14px;
            font-weight: bold;
        }

        @media (max-width: 700px) {
            .header {
                padding: 18px;
            }

            .container {
                padding: 20px;
            }
        }
    </style>
</head>

<body>

    <header class="header">

        <h1>QR Attendance System</h1>

        <a
            href="/admin-web/subject-assignments/"
            class="back"
        >
            ← Back to Assignments
        </a>

    </header>

    <main class="container">

        <div class="page-title">

            <h2>Add Subject Assignment</h2>

            <p>
                Assign a subject to a teacher and class.
            </p>

        </div>

        <div class="form-container">

            {% if error_message %}

                <div class="error">
                    {{ error_message }}
                </div>

            {% endif %}

            <form method="POST">

                {% csrf_token %}

                <div class="form-group">

                    <label for="teacher_id">
                        Teacher
                    </label>

                    <select
                        id="teacher_id"
                        name="teacher_id"
                        required
                    >

                        <option value="">
                            Select Teacher
                        </option>

                        {% for teacher in teachers %}

                            <option value="{{ teacher.teacher_id }}">
                                {{ teacher.full_name }} (ID: {{ teacher.teacher_id }})
                            </option>

                        {% endfor %}

                    </select>

                </div>


                <div class="form-group">

                    <label for="subject_id">
                        Subject
                    </label>

                    <select
                        id="subject_id"
                        name="subject_id"
                        required
                    >

                        <option value="">
                            Select Subject
                        </option>

                        {% for subject in subjects %}

                            <option value="{{ subject.subject_id }}">
                                {{ subject.subject_code }} - {{ subject.subject_name }}
                            </option>

                        {% endfor %}

                    </select>

                </div>


                <div class="form-group">

                    <label for="class_id">
                        Class
                    </label>

                    <select
                        id="class_id"
                        name="class_id"
                        required
                    >

                        <option value="">
                            Select Class
                        </option>

                        {% for class_obj in classes %}

                            <option value="{{ class_obj.class_id }}">
                                {{ class_obj.class_name }} - Semester {{ class_obj.semester }} - Section {{ class_obj.section }}
                            </option>

                        {% endfor %}

                    </select>

                </div>


                <div class="form-group">

                    <label for="academic_year">
                        Academic Year
                    </label>

                    <input
                        type="text"
                        id="academic_year"
                        name="academic_year"
                        placeholder="e.g. 2026-2027"
                        required
                    >

                </div>


                <div class="form-group">

                    <label for="semester">
                        Semester
                    </label>

                    <input
                        type="number"
                        id="semester"
                        name="semester"
                        min="1"
                        required
                    >

                </div>


                <div class="buttons">

                    <button
                        type="submit"
                        class="save-button"
                    >
                        Add Assignment
                    </button>

                    <a
                        href="/admin-web/subject-assignments/"
                        class="cancel-button"
                    >
                        Cancel
                    </a>

                </div>

            </form>

        </div>

    </main>

</body>
</html>
