<!DOCTYPE html>
<html lang="en">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">

    <title>Add Teacher - QR Attendance System</title>

    <style>
        * {
            box-sizing: border-box;
            margin: 0;
            padding: 0;
        }

        body {
            font-family: Arial, sans-serif;
            background: #f7f8fc;
            color: #101828;
        }

        .header {
            background: #175cd3;
            color: white;
            padding: 20px 30px;
            display: flex;
            justify-content: space-between;
            align-items: center;
        }

        .header h1 {
            font-size: 22px;
        }

        .back {
            color: white;
            text-decoration: none;
            font-size: 14px;
        }

        .container {
            max-width: 700px;
            margin: 40px auto;
            padding: 30px;
            background: white;
            border-radius: 15px;
            box-shadow: 0 5px 20px rgba(0, 0, 0, 0.08);
        }

        h2 {
            margin-bottom: 8px;
            font-size: 26px;
        }

        .subtitle {
            color: #667085;
            margin-bottom: 25px;
        }

        .error {
            background: #ffe5e5;
            color: #c62828;
            padding: 12px;
            border-radius: 8px;
            margin-bottom: 20px;
        }

        .form-group {
            margin-bottom: 18px;
        }

        label {
            display: block;
            margin-bottom: 7px;
            font-weight: bold;
        }

        input {
            width: 100%;
            padding: 12px;
            border: 1px solid #d0d5dd;
            border-radius: 8px;
            font-size: 14px;
        }

        input:focus {
            outline: none;
            border-color: #175cd3;
        }

        .buttons {
            display: flex;
            gap: 12px;
            margin-top: 25px;
        }

        button {
            border: none;
            padding: 12px 20px;
            border-radius: 8px;
            font-size: 14px;
            font-weight: bold;
            cursor: pointer;
        }

        .submit-button {
            background: #175cd3;
            color: white;
        }

        .cancel-button {
            background: #e4e7ec;
            color: #344054;
            text-decoration: none;
            padding: 12px 20px;
            border-radius: 8px;
            font-size: 14px;
            font-weight: bold;
        }
    </style>
</head>

<body>

    <header class="header">

        <h1>QR Attendance System</h1>

        <a
            href="/admin-web/teachers/"
            class="back"
        >
            ← Back to Teachers
        </a>

    </header>


    <main class="container">

        <h2>Add Teacher</h2>

        <p class="subtitle">
            Create a teacher account and profile.
        </p>

        {% if error_message %}
            <div class="error">
                {{ error_message }}
            </div>
        {% endif %}

        <form method="POST">

            {% csrf_token %}

            <div class="form-group">
                <label>Username</label>

                <input
                    type="text"
                    name="username"
                    required
                >
            </div>


            <div class="form-group">
                <label>Password</label>

                <input
                    type="password"
                    name="password"
                    required
                >
            </div>


            <div class="form-group">
                <label>Employee ID</label>

                <input
                    type="text"
                    name="employee_id"
                    required
                >
            </div>


            <div class="form-group">
                <label>Full Name</label>

                <input
                    type="text"
                    name="full_name"
                    required
                >
            </div>


            <div class="form-group">
                <label>Email</label>

                <input
                    type="email"
                    name="email"
                >
            </div>


            <div class="form-group">
                <label>Phone</label>

                <input
                    type="text"
                    name="phone"
                >
            </div>


            <div class="form-group">
                <label>Department ID</label>

                <input
                    type="number"
                    name="department_id"
                    required
                >
            </div>


            <div class="buttons">

                <button
                    type="submit"
                    class="submit-button"
                >
                    Add Teacher
                </button>

                <a
                    href="/admin-web/teachers/"
                    class="cancel-button"
                >
                    Cancel
                </a>

            </div>

        </form>

    </main>

</body>
</html>
