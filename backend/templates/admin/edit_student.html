<!DOCTYPE html>
<html>
<head>
    <title>Edit Student - QR Attendance System</title>

    <style>
        body {
            margin: 0;
            font-family: Arial, sans-serif;
            background-color: #f7f8fc;
        }

        .header {
            background: linear-gradient(90deg, #1455d1, #2d70e5);
            color: white;
            padding: 22px 30px;
            display: flex;
            justify-content: space-between;
            align-items: center;
        }

        .header h2 {
            margin: 0;
        }

        .header a {
            color: white;
            text-decoration: none;
            font-size: 14px;
        }

        .container {
            max-width: 700px;
            margin: 40px auto;
            background: white;
            padding: 30px;
            border-radius: 15px;
            box-shadow: 0 5px 20px rgba(0, 0, 0, 0.08);
        }

        h1 {
            margin-top: 0;
            color: #172033;
        }

        .subtitle {
            color: #666;
            margin-bottom: 25px;
        }

        .form-group {
            margin-bottom: 18px;
        }

        label {
            display: block;
            margin-bottom: 7px;
            font-weight: bold;
            color: #333;
        }

        input {
            width: 100%;
            box-sizing: border-box;
            padding: 12px;
            border: 1px solid #d5d9e2;
            border-radius: 8px;
            font-size: 14px;
        }

        input:focus {
            outline: none;
            border-color: #175cd3;
        }

        .error {
            background-color: #ffe5e5;
            color: #c62828;
            padding: 12px;
            border-radius: 8px;
            margin-bottom: 20px;
        }

        .buttons {
            display: flex;
            gap: 12px;
            margin-top: 25px;
        }

        button {
            border: none;
            padding: 12px 22px;
            border-radius: 8px;
            font-size: 14px;
            font-weight: bold;
            cursor: pointer;
        }

        .update-btn {
            background-color: #175cd3;
            color: white;
        }

        .cancel-btn {
            background-color: #e5e7eb;
            color: #333;
            text-decoration: none;
            padding: 12px 22px;
            border-radius: 8px;
            font-size: 14px;
            font-weight: bold;
        }
    </style>
</head>

<body>

    <div class="header">
        <h2>QR Attendance System</h2>
        <a href="/admin-web/students/">← Back to Students</a>
    </div>

    <div class="container">

        <h1>Edit Student</h1>

        <p class="subtitle">
            Update the student's details below.
        </p>

        {% if error_message %}
            <div class="error">
                {{ error_message }}
            </div>
        {% endif %}

        <form method="POST">

            {% csrf_token %}

            <div class="form-group">
                <label>Register Number</label>
                <input
                    type="text"
                    name="register_no"
                    value="{{ student.register_no }}"
                    required
                >
            </div>

            <div class="form-group">
                <label>Full Name</label>
                <input
                    type="text"
                    name="full_name"
                    value="{{ student.full_name }}"
                    required
                >
            </div>

            <div class="form-group">
                <label>Email</label>
                <input
                    type="email"
                    name="email"
                    value="{{ student.email|default:'' }}"
                >
            </div>

            <div class="form-group">
                <label>Phone</label>
                <input
                    type="text"
                    name="phone"
                    value="{{ student.phone|default:'' }}"
                >
            </div>

            <div class="form-group">
                <label>Class ID</label>
                <input
                    type="number"
                    name="class_id"
                    value="{{ student.class_id }}"
                    required
                >
            </div>

            <div class="buttons">

                <button
                    type="submit"
                    class="update-btn"
                >
                    Update Student
                </button>

                <a
                    href="/admin-web/students/"
                    class="cancel-btn"
                >
                    Cancel
                </a>

            </div>

        </form>

    </div>

</body>
</html>
