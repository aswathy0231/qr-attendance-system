<!DOCTYPE html>
<html lang="en">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">

    <title>Admin Login</title>

    <style>
        * {
            box-sizing: border-box;
            margin: 0;
            padding: 0;
        }

        body {
            font-family: Arial, sans-serif;
            background: #f8f9fe;
            min-height: 100vh;

            display: flex;
            justify-content: center;
            align-items: center;

            padding: 20px;
        }

        .login-container {
            width: 100%;
            max-width: 420px;
        }

        .header {
            background: linear-gradient(
                135deg,
                #1558d6,
                #2872e8
            );

            height: 170px;

            border-radius: 25px 25px 0 0;

            display: flex;
            justify-content: center;
            align-items: center;
        }

        .icon {
            width: 80px;
            height: 80px;

            background: white;

            border-radius: 22px;

            display: flex;
            justify-content: center;
            align-items: center;

            font-size: 45px;
        }

        .login-card {
            background: white;

            padding: 30px;

            border-radius: 0 0 25px 25px;

            box-shadow:
                0 8px 25px rgba(0, 0, 0, 0.08);
        }

        .title {
            text-align: center;

            font-size: 24px;
            font-weight: bold;

            margin-bottom: 6px;
        }

        .subtitle {
            text-align: center;

            color: #667085;

            font-size: 14px;

            margin-bottom: 28px;
        }

        .form-group {
            margin-bottom: 16px;
        }

        label {
            display: block;

            font-size: 13px;
            font-weight: bold;

            margin-bottom: 7px;
        }

        input {
            width: 100%;

            padding: 14px;

            border: 1px solid #d0d5dd;

            border-radius: 12px;

            font-size: 14px;

            outline: none;
        }

        input:focus {
            border-color: #175cd3;
        }

        .error {
            background: #fff1f0;

            color: #d92d20;

            padding: 12px;

            border-radius: 10px;

            font-size: 13px;

            margin-bottom: 16px;

            text-align: center;
        }

        .login-button {
            width: 100%;

            padding: 15px;

            border: none;

            border-radius: 12px;

            background: #175cd3;

            color: white;

            font-size: 16px;

            font-weight: bold;

            cursor: pointer;
        }

        .login-button:hover {
            background: #124bb3;
        }

        .contact {
            text-align: center;

            margin-top: 22px;

            color: #667085;

            font-size: 13px;
        }
    </style>
</head>

<body>

    <div class="login-container">

        <div class="header">
            <div class="icon">
                🔐
            </div>
        </div>

        <div class="login-card">

            <div class="title">
                Admin Login
            </div>

            <div class="subtitle">
                Sign in to manage the attendance system
            </div>

            {% if error_message %}
                <div class="error">
                    {{ error_message }}
                </div>
            {% endif %}

            <form method="POST">

                {% csrf_token %}

                <div class="form-group">

                    <label for="username">
                        Username
                    </label>

                    <input
                        type="text"
                        id="username"
                        name="username"
                        placeholder="Enter admin username"
                        required
                    >

                </div>

                <div class="form-group">

                    <label for="password">
                        Password
                    </label>

                    <input
                        type="password"
                        id="password"
                        name="password"
                        placeholder="Enter admin password"
                        required
                    >

                </div>

                <button
                    type="submit"
                    class="login-button"
                >
                    Login
                </button>

            </form>

            <div class="contact">
                Authorized administrators only.
            </div>

        </div>

    </div>

</body>
</html>
